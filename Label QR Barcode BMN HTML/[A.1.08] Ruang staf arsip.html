<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[A.1.08] Ruang staf arsip - Cetak Label BMN A4</title>
  <style>
    /* STANDAR PRESISI KERTAS CETAK A4 & LABEL BMN (FISIK MM) */
    :root {
      --page-width: 210mm;
      --page-height: 297mm;
      --page-margin-top: 11.14mm;
      --page-margin-bottom: 3.64mm;
      --page-margin-left: 4.67mm;
      --page-margin-right: 4.67mm;

      /* Ukuran Fisik Label */
      --label-width: 98mm;
      --label-height: 44mm;
      --header-height: 14.8mm;
      --label-col-gap: 4.67mm;
      --label-row-gap: 3.64mm;
      --grid-cols: 2;

      /* Ukuran Gambar & Logo */
      --qr-size: 21mm;
      --logo-size: 6mm;

      /* Standar Tipografi Spesifikasi */
      --instansi-font-size: 10.5pt;
      --satker-font-size: 9pt;
      --body-font-size: 9pt;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
      color: #000000 !important;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Pembagi halaman lembar A4 fisik */
    .sheet-wrapper {
      margin: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
      border: none !important;
      display: block !important;
      width: 210mm !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      page-break-after: always !important;
      break-after: page !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      overflow: visible !important;
    }

    .sheet-wrapper:last-child,
    .sheet-wrapper:last-of-type {
      page-break-after: auto !important;
      break-after: auto !important;
    }

    /* Lembar A4 di dalam printer: 210mm x 296mm (buffer 1mm mencegah pembulatan sub-pixel di Chromium / Edge yang memicu halaman kosong 2, 4, 6) */
    .a4-sheet {
      width: 210mm !important;
      height: 296mm !important;
      max-height: 296mm !important;
      min-height: 0 !important;
      margin: 0 auto !important;
      padding-top: var(--page-margin-top) !important;
      padding-bottom: var(--page-margin-bottom) !important;
      padding-left: var(--page-margin-left) !important;
      padding-right: var(--page-margin-right) !important;
      box-sizing: border-box !important;
      border: none !important;
      box-shadow: none !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      page-break-after: auto !important;
      break-after: auto !important;
      overflow: hidden !important;
      background: #ffffff !important;
      position: relative !important;
    }

    /* Header Kertas A4 Mengambang Absolut di Margin Atas Kertas Cetak */
    .sheet-paper-header {
      position: absolute !important;
      top: 3.8mm !important;
      left: var(--page-margin-left) !important;
      right: var(--page-margin-right) !important;
      height: 5.5mm !important;
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      visibility: visible !important;
      z-index: 10 !important;
      pointer-events: none;
      line-height: 1;
    }

    .sheet-paper-single-title {
      font-size: 8pt;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.8mm;
      font-family: Arial, Helvetica, sans-serif;
    }

    .sheet-room-tag {
      font-size: 7.5pt;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: 0.4px;
    }

    .sheet-room-name {
      font-weight: 800;
      color: #000000;
      text-transform: uppercase;
    }

    .sheet-header-bullet {
      color: #64748b;
      font-weight: 700;
      font-size: 8pt;
    }

    .sheet-page-info {
      font-size: 7.5pt;
      font-weight: 700;
      color: #334155;
    }

    .sheet-count-info {
      font-size: 7pt;
      font-weight: 600;
      color: #64748b;
    }

    /* Grid 2 Kolom x 6 Baris Label */
    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(2, var(--label-width));
      grid-auto-rows: var(--label-height);
      column-gap: var(--label-col-gap);
      row-gap: var(--label-row-gap);
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      align-content: start;
      justify-content: center;
    }

    /* Kartu Label Tunggal: Outline Hitam Tegas Standar BMN (98mm x 44mm) */
    .item-label {
      width: var(--label-width);
      height: var(--label-height);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
      padding: 1.2mm 2.0mm;
      border: 1px solid #000000 !important;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Bagian Header Label */
    .label-header {
      height: var(--header-height);
      min-height: var(--header-height);
      max-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.2px solid #000000;
      padding-bottom: 0.8mm;
      margin-bottom: 0.8mm;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .header-logo-box {
      width: var(--logo-size);
      height: var(--logo-size);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .header-text-box {
      flex: 1;
      text-align: center;
      padding: 0 1mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.15;
    }

    .instansi-line1,
    .instansi-line2 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: var(--instansi-font-size);
      font-weight: 700;
      color: #000000;
      letter-spacing: -0.2px;
    }

    .satker-code-line {
      font-family: Arial, Helvetica, sans-serif;
      font-size: var(--satker-font-size);
      font-weight: 700;
      color: #000000;
      margin-top: 0.3mm;
    }

    /* Bagian Body Label (Data Kiri & QR Kanan) */
    .label-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      box-sizing: border-box;
    }

    .body-info-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding-right: 1.5mm;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .info-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5mm;
      margin-bottom: 0.8mm;
    }

    .info-kode-barang {
      font-size: var(--body-font-size);
      font-weight: 700;
      color: #000000;
      font-family: monospace, Arial;
    }

    .info-nup {
      font-size: var(--body-font-size);
      font-weight: 700;
      color: #000000;
      white-space: nowrap;
    }

    .info-nama-barang {
      font-size: var(--body-font-size);
      font-weight: 700;
      color: #000000;
      text-transform: uppercase;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .info-merk-tipe {
      font-size: calc(var(--body-font-size) - 0.5pt);
      font-weight: 400;
      color: #1e293b;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: auto;
    }

    .body-qr-right {
      width: calc(var(--qr-size) + 1mm);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qr-box {
      width: var(--qr-size);
      height: var(--qr-size);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @page {
      size: 210mm 297mm;
      margin: 0 !important;
    }
  </style>
</head>
